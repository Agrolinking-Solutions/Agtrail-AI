# Production API container. The database is a managed Postgres (with
# PostGIS) configured through DATABASE_URL in backend/.env or the host's
# secret store, it is not run here. Put a TLS-terminating reverse proxy
# or the platform's load balancer in front of port 8000.
#
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build

services:

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: agtrail_backend
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3g

  # Runs classification jobs the backend enqueues into the jobs table
  # (app/worker.py). Scheduled rather than always-on: `--once` requeues
  # any stale jobs, drains whatever's due, and exits, so this only costs
  # while it's actually running instead of paying for an idle process
  # between webhooks. Predictions lag by up to the sleep interval below
  # rather than landing within seconds; on a host with a real cron
  # (or Render's own Cron Job service), replace this sleep loop with an
  # actual cron entry running `python -m app.worker --once` instead.
  # Switch to `python -m app.worker` (no --once, restart: always) if
  # volume grows enough to justify an always-on process.
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c "while true; do python -m app.worker --once; sleep 600; done"

  # Extra safety net beyond what `worker --once` already requeues on each
  # run: catches a pending image that somehow has no job at all (e.g. one
  # that predates this queue). Rare in practice, cheap to run occasionally.
  reprocess:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c "while true; do python -m app.jobs.reprocess_images; sleep 900; done"
