# Production API container. The database is a managed Postgres (with
# PostGIS) configured through DATABASE_URL in backend/.env or the host's
# secret store, it is not run here. Put a TLS-terminating reverse proxy
# or the platform's load balancer in front of port 8000.
#
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build

services:

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: agtrail_backend
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3g

  # Retries images left pending, e.g. after a restart. Replace with a
  # real job queue once volume grows.
  reprocess:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c "while true; do python -m app.jobs.reprocess_images; sleep 900; done"
