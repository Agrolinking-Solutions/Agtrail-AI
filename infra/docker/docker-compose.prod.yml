# Production API container. The database is a managed Postgres (with
# PostGIS) configured through DATABASE_URL in backend/.env or the host's
# secret store, it is not run here. Put a TLS-terminating reverse proxy
# or the platform's load balancer in front of port 8000.
#
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build

services:

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: agtrail_backend
    restart: always
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3g

  # Runs classification jobs the backend enqueues into the jobs table
  # (app/worker.py). `--once` requeues any stale jobs, drains whatever's
  # due, and exits, so this is meant to be invoked by the host's real
  # cron, not left running: `restart: "no"` on purpose. Add this line to
  # the VPS's crontab (adjust the path to where this repo lives):
  #
  #   */10 * * * * cd /opt/agtrail-ai && docker compose -f infra/docker/docker-compose.prod.yml run --rm worker >> /var/log/agtrail-worker.log 2>&1
  #
  # Switch to `python -m app.worker` (no --once, restart: always) as a
  # separate service instead if volume grows enough to justify an
  # always-on process rather than polling every 10 minutes.
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ../../backend/.env
    environment:
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: python -m app.worker --once
